<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zaro Template Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#fff;font-family:Inter,Arial,sans-serif}.bar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 5%;background:#0d1220ee;border-bottom:1px solid #263047;backdrop-filter:blur(12px)}.bar strong{font-size:18px}.bar a,.bar button{border:1px solid #39445d;border-radius:9px;padding:10px 14px;background:#151d2e;color:#fff;text-decoration:none;cursor:pointer}.bar .buy{background:#7657ff;border-color:#7657ff}.site{min-height:100vh}.site-nav{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 6%;border-bottom:1px solid var(--line)}.logo{font-size:24px;font-weight:900;letter-spacing:-1px}.links{display:flex;gap:22px;flex-wrap:wrap}.links a{color:inherit;text-decoration:none;font-size:14px}.cta{background:var(--accent);color:#fff;padding:12px 17px;border-radius:8px;text-decoration:none;font-weight:700;white-space:nowrap}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center;padding:75px 6%;background:var(--hero)}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:800}.hero h1{font-size:clamp(42px,5vw,76px);line-height:.98;letter-spacing:-3px;margin:18px 0}.hero p{color:var(--muted);font-size:17px;line-height:1.7;max-width:560px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.ghost{padding:12px 17px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:inherit}.visual{min-height:350px;border:1px solid var(--line);border-radius:24px;padding:22px;background:var(--visual);box-shadow:0 25px 80px #0004}.window{background:var(--window);border-radius:15px;padding:18px;color:var(--ink);height:100%;min-height:300px}.dots{display:flex;gap:6px;margin-bottom:20px}.dots i{width:9px;height:9px;border-radius:50%;background:#9aa5b8}.section{padding:70px 6%;background:var(--surface)}.section h2{text-align:center;font-size:36px;margin:0 0 35px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink)}.card h3{margin-top:0;font-size:21px}.card p{color:var(--muted);line-height:1.6}.price{font-size:25px;font-weight:900}.product-img{height:145px;border-radius:12px;background:linear-gradient(135deg,#dce9ff,#7e9fff);margin-bottom:15px}.metric{font-size:30px;font-weight:900;margin-top:8px}.chart{height:150px;margin-top:20px;border-radius:12px;background:linear-gradient(160deg,transparent 60%,#6475ff 61%,transparent 64%),linear-gradient(25deg,transparent 42%,#28c7e8 43%,transparent 46%),#e7edf8}.menu{display:grid;gap:13px}.menu div{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:12px 0}.menu b{color:#b45309}.property{height:125px;border-radius:12px;background:linear-gradient(135deg,#d6b48a,#667a91);margin-bottom:14px}.course{background:linear-gradient(135deg,#dbeafe,#a5b4fc);height:110px;border-radius:12px;margin-bottom:14px}.portfolio{display:grid;grid-template-columns:1fr 1fr;gap:10px}.portfolio div{height:100px;border-radius:10px;background:linear-gradient(135deg,#f0abfc,#818cf8)}.profile{display:flex;align-items:center;gap:15px}.face{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#f3c5a3,#7186a2)}footer{padding:30px 6%;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;background:#0b101b;color:#9da8bc}@media(max-width:850px){.hero{grid-template-columns:1fr;padding:50px 6%}.grid{grid-template-columns:1fr 1fr}.links{display:none}.site-nav{padding:20px 5%}}@media(max-width:560px){.bar{align-items:flex-start;flex-wrap:wrap}.hero h1{letter-spacing:-1.5px}.grid{grid-template-columns:1fr}.visual{min-height:280px}.section{padding:45px 6%}}
</style>
</head>
<body>
<header class="bar"><strong id="title">Website Preview</strong><div><a href="templates.html">← Back</a> <button class="buy" onclick="buyTemplate()">Buy Template</button></div></header>
<div id="app"></div>
<script>
const type=new URLSearchParams(location.search).get('template')||'Ecommerce Store';
const configs={
'Ecommerce Store':{cls:'shop',brand:'NOVA SHOP',accent:'#6d5dfc',hero:'#f5f3ff',surface:'#faf9ff',visual:'#e9e5ff',window:'#fff',ink:'#202033',muted:'#687089',line:'#ddd8f4',title:'Modern products. Better living.',desc:'A conversion-focused online store with product collections, offers, shopping cart and checkout.',nav:['Home','Shop','Categories','Offers','Contact'],section:'Featured products',cards:[['Smart Device','₹2,499'],['Wireless Headphones','₹1,999'],['Premium Laptop','₹54,999']]},
'Education Academy':{brand:'LEARN ACADEMY',accent:'#2563eb',hero:'#eff6ff',surface:'#f8fbff',visual:'#dbeafe',window:'#fff',ink:'#172554',muted:'#64748b',line:'#cbd5e1',title:'Learn. Achieve. Master.',desc:'A complete education website for courses, faculty, admissions, student resources and learning paths.',nav:['Courses','Faculty','Admissions','Campus','Contact'],section:'Popular courses',cards:[['Web Development','Beginner to advanced'],['Artificial Intelligence','Build the future'],['Data Science','Python and analytics']]},
'Restaurant & Cafe':{brand:'SAVOR',accent:'#b45309',hero:'#fff7ed',surface:'#fffaf5',visual:'#fed7aa',window:'#fff',ink:'#431407',muted:'#78716c',line:'#fed7aa',title:'Taste the extraordinary.',desc:'A premium restaurant interface with chef story, menu, reservation and location sections.',nav:['Home','Menu','Our Story','Reservations','Contact'],section:'Chef’s menu',cards:[['Signature Pasta','₹499'],['Chef Special Pizza','₹699'],['Chocolate Dessert','₹299']]},
'Business Dashboard':{brand:'BUSINESS HUB',accent:'#38bdf8',hero:'#101827',surface:'#0d1422',visual:'#1b2a42',window:'#19253a',ink:'#fff',muted:'#a5b4cc',line:'#2b3b55',title:'Performance that moves business.',desc:'A professional company dashboard with revenue, customers, analytics and reporting.',nav:['Overview','Analytics','Customers','Reports','Settings'],section:'Business overview',cards:[['Revenue','₹24.5K'],['Customers','1,240'],['Growth','84%']]},
'Real Estate Agency':{brand:'NEST REALTY',accent:'#0f766e',hero:'#f0fdfa',surface:'#f8fffe',visual:'#ccfbf1',window:'#fff',ink:'#134e4a',muted:'#64748b',line:'#ccfbf1',title:'Your next chapter begins here.',desc:'A property website for homes, apartments, commercial spaces, agents and enquiries.',nav:['Properties','Buy','Rent','Agents','Contact'],section:'Featured properties',cards:[['Luxury Villa','3 BHK · Bengaluru'],['Modern Apartment','2 BHK · Mysuru'],['Commercial Office','Prime location']]},
'Creative Agency Portfolio':{brand:'CREATIVE LAB',accent:'#a855f7',hero:'#faf5ff',surface:'#fffaff',visual:'#f3e8ff',window:'#fff',ink:'#3b0764',muted:'#7c6f8e',line:'#e9d5ff',title:'Strategy. Design. Innovation.',desc:'A bold creative agency portfolio for branding, websites, campaigns and client work.',nav:['Work','Services','About','Clients','Contact'],section:'Selected work',cards:[['Brand Identity','Strategy and systems'],['UI/UX Design','Digital experiences'],['Motion Design','Stories in motion']]},
'Personal Brand Website':{brand:'SARAH CHEN',accent:'#db2777',hero:'#fff1f2',surface:'#fff7f8',visual:'#fce7f3',window:'#fff',ink:'#500724',muted:'#9f7890',line:'#fbcfe8',title:'Introduce. Inspire. Connect.',desc:'A personal brand website for creators, consultants, influencers and professionals.',nav:['About','Projects','Blog','Services','Contact'],section:'Latest work',cards:[['Portfolio','Show your best work'],['Latest Blog','Share your ideas'],['Work With Me','Invite collaborations']]},
'High-Conversion Landing Page':{brand:'ZARO STUDIO',accent:'#4f46e5',hero:'#eef2ff',surface:'#f8faff',visual:'#e0e7ff',window:'#fff',ink:'#1e1b4b',muted:'#64748b',line:'#c7d2fe',title:'Unlock global growth.',desc:'A focused landing page for products, services, startups and high-conversion campaigns.',nav:['Home','Features','Benefits','About','Contact'],section:'Why choose us',cards:[['Simple','Clear messaging'],['Powerful','Strong conversion sections'],['Responsive','Works on every device']]}
};
const c=configs[type]||configs['Ecommerce Store'];document.getElementById('title').textContent=type+' — Full Website Preview';
function visual(){if(type.includes('Business'))return '<div class="window"><div class="dots"><i></i><i></i><i></i></div><h2>Analytics overview</h2><div class="metric">₹24,500</div><p>Monthly revenue</p><div class="chart"></div></div>';if(type.includes('Restaurant'))return '<div class="window"><div class="dots"><i></i><i></i><i></i></div><h2>Today’s special</h2><div class="property"></div><h3>Chef’s signature dish</h3><p>Fresh ingredients. Memorable taste.</p></div>';if(type.includes('Real'))return '<div class="window"><div class="dots"><i></i><i></i><i></i></div><h2>Find your next home</h2><div class="property"></div><h3>Luxury Villa</h3><p>3 BHK · Bengaluru</p></div>';if(type.includes('Education'))return '<div class="window"><div class="dots"><i></i><i></i><i></i></div><h2>Continue learning</h2><div class="course"></div><h3>Web Development</h3><p>72% course progress</p></div>';if(type.includes('Creative'))return '<div class="window"><div class="dots"><i></i><i></i><i></i></div><h2>Our latest work</h2><div class="portfolio"><div></div><div></div><div></div><div></div></div></div>';if(type.includes('Personal'))return '<div class="window"><div class="dots"><i></i><i></i><i></i></div><div class="profile"><div class="face"></div><div><h2>Sarah Chen</h2><p>Creator · Strategist</p></div></div><p>Ideas, projects and stories.</p></div>';return '<div class="window"><div class="dots"><i></i><i></i><i></i></div><h2>Featured collection</h2><div class="product-img"></div><h3>Modern product showcase</h3><p>Beautiful products presented for your customers.</p></div>'}
function card(item){if(type.includes('Restaurant'))return `<div class="card"><h3>${item[0]}</h3><div class="menu"><div><span>Fresh ingredients</span><b>${item[1]}</b></div><div><span>Chef recommended</span><b>★★★★★</b></div></div></div>`;if(type.includes('Real'))return `<div class="card"><div class="property"></div><h3>${item[0]}</h3><p>${item[1]}</p><a class="cta" href="#">View property</a></div>`;if(type.includes('Education'))return `<div class="card"><div class="course"></div><h3>${item[0]}</h3><p>${item[1]}</p><a class="cta" href="#">View course</a></div>`;if(type.includes('Ecommerce'))return `<div class="card"><div class="product-img"></div><h3>${item[0]}</h3><div class="price">${item[1]}</div><br><a class="cta" href="#">Add to cart</a></div>`;if(type.includes('Business'))return `<div class="card"><p>${item[0]}</p><div class="metric">${item[1]}</div></div>`;return `<div class="card"><h3>${item[0]}</h3><p>${item[1]}</p><a class="cta" href="#">Explore →</a></div>`}
const html=`<div class="site" style="--accent:${c.accent};--hero:${c.hero};--surface:${c.surface};--visual:${c.visual};--window:${c.window};--ink:${c.ink};--muted:${c.muted};--line:${c.line};--card:${c.window}"><nav class="site-nav"><div class="logo">${c.brand}</div><div class="links">${c.nav.map(x=>`<a href="#">${x}</a>`).join('')}</div><a class="cta" href="#">Get Started</a></nav><section class="hero"><div><div class="eyebrow">PREMIUM WEBSITE TEMPLATE</div><h1>${c.title}</h1><p>${c.desc}</p><div class="actions"><a class="cta" href="#">Explore website →</a><a class="ghost" href="#">Learn more</a></div></div><div class="visual">${visual()}</div></section><section class="section"><h2>${c.section}</h2><div class="grid">${c.cards.map(card).join('')}</div></section><footer><span>© 2026 ${c.brand}</span><span>${c.nav.join(' · ')}</span></footer></div>`;document.getElementById('app').innerHTML=html;
function buyTemplate(){location.href='payment.html?template='+encodeURIComponent(type)}
</script>
</body>
</html>
